name: Build and verify installers
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*', 'windows-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - shell: pwsh
        run: ./packaging/build-windows.ps1 -OutputDirectory dist
      - shell: pwsh
        run: ./tests/windows-install.ps1 -Setup (Resolve-Path dist/ArrowKeys-Windows-Setup.exe)
      - name: Install and exercise the Store edition on a clean Windows desktop
        shell: pwsh
        run: |
          python -m pip install Pillow==12.2.0
          ./packaging/build-store.ps1 -IdentityName ArrowKeys.CI -Publisher CN=ArrowKeys.CI -PublisherDisplayName ArrowKeys -Version 1.1.2.0
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/windows-store.ps1
      - name: Start both editions and keep only the one started last
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/windows-both.ps1 -Setup (Resolve-Path dist/ArrowKeys-Windows-Setup.exe)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: store-guide
          path: dist/store/Shortcut-guide.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: dist/ArrowKeys-Windows-Setup.exe

  macos:
    if: "!startsWith(github.ref, 'refs/tags/windows-v')"
    # Run the universal app on Intel for PRs and releases, and Apple silicon on main.
    runs-on: ${{ github.ref == 'refs/heads/main' && 'macos-15' || 'macos-15-intel' }}
    # Release tags, and manual runs on main for a dry run, sign with Developer ID and notarize.
    # Only these runs can read the signing secrets in the mac-release environment.
    environment: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && 'mac-release' || '' }}
    env:
      SIGN: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && '1' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Load the Developer ID certificates into a temporary keychain
        if: env.SIGN == '1'
        env:
          APP_P12: ${{ secrets.MAC_APP_P12 }}
          INSTALLER_P12: ${{ secrets.MAC_INSTALLER_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_P12_PASSWORD }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          for certificate in APP_P12 INSTALLER_P12; do
            printenv "$certificate" | base64 --decode > "$RUNNER_TEMP/identity.p12"
            security import "$RUNNER_TEMP/identity.p12" -k "$keychain" -P "$P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild
            rm "$RUNNER_TEMP/identity.p12"
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity() { security find-identity -v -p basic "$keychain" | sed -n "s/.*\"\($1: .* (B7UFH23G3L)\)\"\$/\1/p" | head -1; }
          app=$(identity 'Developer ID Application')
          installer=$(identity 'Developer ID Installer')
          test -n "$app" && test -n "$installer"
          printenv ASC_API_KEY_P8 | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          { echo "MAC_APP_IDENTITY=$app"; echo "MAC_INSTALLER_IDENTITY=$installer"
            echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"; } >> "$GITHUB_ENV"
      - run: bash packaging/build-mac.sh dist
      - name: Notarize the package with Apple
        if: env.SIGN == '1'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bash packaging/notarize-mac.sh dist/ArrowKeys-macOS.pkg
      - run: bash tests/macos-install.sh "$PWD/macos"
      - name: Test install, cursor movement, uninstall and reinstall on a clean Mac
        env:
          MAC_EXPECT_SIGNED: ${{ env.SIGN }}
        run: bash tests/macos-lifecycle.sh "$PWD/dist/ArrowKeys-macOS.pkg"
      - name: Remove the signing keychain and API key
        if: always() && env.SIGN == '1'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          path: dist/

  scan:
    needs: [windows, macos]
    if: >-
      !cancelled() && needs.windows.result == 'success' &&
      (needs.macos.result == 'success' ||
      (startsWith(github.ref, 'refs/tags/windows-v') && needs.macos.result == 'skipped'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '{windows,macos}'
          path: dist
          merge-multiple: true
      - name: Scan release downloads with ClamAV
        run: |
          docker pull clamav/clamav:stable
          docker run --rm --network none --entrypoint clamscan clamav/clamav:stable --version
          docker run --rm --network none --entrypoint clamscan -v "$PWD/dist:/scan:ro" clamav/clamav:stable --recursive /scan

  release:
    if: >-
      !cancelled() && needs.scan.result == 'success' && github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/windows-v'))
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '{windows,macos}'
          path: dist
          merge-multiple: true
      - name: Include the corresponding AutoHotkey source
        run: curl -fsSL --retry 3 https://github.com/AutoHotkey/AutoHotkey/archive/refs/tags/v2.0.32.tar.gz -o dist/AutoHotkey-2.0.32-source.tar.gz
      - name: Publish build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - name: Publish the verified downloads
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum ArrowKeys-* AutoHotkey-* > SHA256SUMS.txt
          if [[ "$GITHUB_REF_NAME" == windows-v* ]]; then
            test -f ArrowKeys-Windows-Setup.exe
            test ! -e ArrowKeys-macOS.pkg
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false \
              --title "ArrowKeys ${GITHUB_REF_NAME#windows-v} for Windows" \
              --notes "Download ArrowKeys-Windows-Setup.exe to install ArrowKeys for your Windows account. This version includes the new ArrowKeys icon and links to the [source code]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_REF_NAME) and verified downloads in the installer. The [Windows installation and removal tests and ClamAV scan]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) passed. The standalone installer is unsigned. Use SHA256SUMS.txt and the GitHub build provenance to verify your download." ./*
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "ArrowKeys $GITHUB_REF_NAME" --notes "Download ArrowKeys-Windows-Setup.exe for Windows or ArrowKeys-macOS.pkg for Mac. The Mac package works offline and opens in Apple's Installer. Both downloads passed the [installation tests and ClamAV scan]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). The assets include SHA-256 checksums and have GitHub build provenance. The Mac package is signed with Developer ID and notarized by Apple. See the README for permissions and verification." ./*
