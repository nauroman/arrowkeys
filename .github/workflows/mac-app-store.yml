name: Mac App Store candidate
on:
  push:
    branches: [codex/mac-app-store-hotkeys]
  pull_request:
    paths:
      - 'macos/**'
      - 'packaging/build-mac-store.sh'
      - 'packaging/mac-app-store/**'
      - 'tests/macos-store/**'
      - '.github/workflows/mac-app-store.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: macos-15-intel
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash packaging/build-mac-store.sh dist/mac-app-store
      - run: bash tests/macos-install.sh "$PWD/macos"
      - run: bash tests/macos-store/run.sh dist/mac-app-store --hosted
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ArrowKeys-Mac-App-Store-Candidate
          path: dist/mac-app-store/*.zip
          if-no-files-found: error
